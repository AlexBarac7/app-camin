services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Export POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:${PGPORT:?PGPORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s
  backend:
    build: ./backend
    environment:
      PORT: ${BACKEND_PORT:?BACKEND_PORT is required}
      PGHOST: ${PGHOST:?PGHOST is required}
      PGPORT: ${PGPORT:?PGPORT is required}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Export POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:3000"
    volumes:
      - ./backend/src:/app/src:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready', { signal: AbortSignal.timeout(5000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 3
  frontend:
    build: ./frontend
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:?FRONTEND_PORT is required}
      API_PROXY_TARGET: http://backend:3000
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend/src:/app/src:ro
    depends_on:
      backend:
        condition: service_started
volumes:
  postgres_data:
