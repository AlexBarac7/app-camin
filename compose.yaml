services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Export POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:${PGPORT:?PGPORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s
  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      CAMIN_LOCAL_TEST_ACCOUNTS: ${CAMIN_LOCAL_TEST_ACCOUNTS:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      INTERNAL_READINESS_PORT: 3001
      APP_ORIGIN: ${APP_ORIGIN:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      PHOTO_S3_ENDPOINT: ${PHOTO_S3_ENDPOINT:-http://photo-store:8333}
      PHOTO_S3_BUCKET: ${PHOTO_S3_BUCKET:-camin-report-photos}
      PHOTO_S3_ACCESS_KEY: ${PHOTO_S3_ACCESS_KEY:-}
      PHOTO_S3_SECRET_KEY: ${PHOTO_S3_SECRET_KEY:-}
      PHOTO_S3_REGION: ${PHOTO_S3_REGION:-us-east-1}
      PORT: ${BACKEND_PORT:?BACKEND_PORT is required}
      PGHOST: ${PGHOST:?PGHOST is required}
      PGPORT: ${PGPORT:?PGPORT is required}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Export POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:3000"
    volumes:
      - ./backend/src:/app/src:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready', { signal: AbortSignal.timeout(5000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 3
  mailpit:
    image: axllent/mailpit:v1.27.4
    profiles: [mail]
    ports:
      - "127.0.0.1:8025:8025"
  photo-store:
    image: chrislusf/seaweedfs:4.55
    profiles: [photos]
    environment:
      AWS_ACCESS_KEY_ID: ${PHOTO_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${PHOTO_S3_SECRET_KEY:-}
      S3_BUCKET: ${PHOTO_S3_BUCKET:-camin-report-photos}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$$AWS_ACCESS_KEY_ID" && test -n "$$AWS_SECRET_ACCESS_KEY" || {
          echo 'Export PHOTO_S3_ACCESS_KEY and PHOTO_S3_SECRET_KEY before enabling photo storage.' >&2
          exit 1
        }
        exec weed mini -dir=/data
    volumes:
      - report_photos:/data
  frontend:
    build: ./frontend
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:?FRONTEND_PORT is required}
      API_PROXY_TARGET: http://backend:3000
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend/src:/app/src:ro
    depends_on:
      backend:
        condition: service_started
volumes:
  postgres_data:
  report_photos:
